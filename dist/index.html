<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#162b27"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>ANYA / ボイスの引き出し</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ed;color:#162b27;font-family:system-ui,sans-serif}header,main,footer{max-width:1000px;margin:auto;padding:24px}header{padding-top:40px}small{letter-spacing:.16em;font-weight:800}h1{font-size:clamp(32px,7vw,56px);letter-spacing:-.05em;margin:12px 0}p{color:#61716a;line-height:1.7}button,input,select{font:inherit}button{cursor:pointer;border:0}input{width:100%;padding:18px;border:1px solid #d4d9ce;border-radius:16px;background:white}nav{display:flex;gap:8px;overflow:auto;padding:18px 0}nav button,.pill{white-space:nowrap;border-radius:30px;padding:12px 18px;background:#e7eadd;color:#162b27}nav button.active{background:#162b27;color:white}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:20px}.card{background:white;border:1px solid #e2e4d9;border-radius:20px;padding:12px;position:relative}.play{background:transparent;color:#162b27;text-align:left;width:100%;min-height:110px;padding:12px}.play b{display:block;font-size:18px;line-height:1.45;margin-top:14px;overflow-wrap:anywhere}.card.playing{background:#f9d9df;border-color:#d990a1}.star{float:right;background:transparent;font-size:22px;color:#a56532}.tag{font-size:12px;color:#68796c}.dock{position:sticky;bottom:0;background:#162b27;color:white;padding:16px 24px;display:flex;justify-content:space-between;gap:12px;align-items:center;box-shadow:0 -5px 24px #0002}.dock button{background:#f2b7c7;border-radius:14px;padding:14px 24px}#status{font-size:13px}input[type=range]{width:100px;padding:0}button:focus-visible{outline:3px solid #df7b99}footer{font-size:12px;padding-bottom:40px}
</style><header><small>ANYA SOUND COLLECTION</small><h1>ひと押しで、あの声。</h1><p>気分にぴったりの声を、ポン。<br>あなたのポケットに、ボイスの引き出し。</p><input id="search" type="search" placeholder="セリフ・名前でさがす" aria-label="音声を検索"><nav id="categories"></nav><div class="toolbar"><button class="pill" id="random">↝ おまかせ再生</button><button class="pill" id="offline">↓ 全音声をオフライン保存</button><button class="pill" id="install" hidden>＋ アプリを入れる</button><label>音量 <input id="volume" aria-label="音量" type="range" min="0" max="1" step=".05" value="1"></label></div><p id="status" role="status">読み込み中…</p></header><main><small id="count"></small><div id="grid" class="grid"></div></main><div class="dock"><span id="now" aria-live="polite">声を選んでタップ</span><button id="stop">■ 停止</button></div><footer>分類はファイル名からの推定です。内容不明の音声は「内容確認」にまとめています。☆でお気に入りに登録できます。<br>Android：HTTPSのURLをChromeで開き、メニュー →「ホーム画面に追加」→「インストール」。</footer><script src="app.js"></script></html>
